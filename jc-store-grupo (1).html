<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b4f9c">
  <title>JC STORE | Grupo Oficial</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue-main: #1677d2;
      --blue-light: #2f8ee5;
      --blue-soft: #8fc8f5;
      --bg: #071522;
      --bg-2: #0b1d30;
      --text: #f5f9ff;
      --muted: #9eafc2;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 45%, rgba(47, 142, 229, 0.13), transparent 38%),
        linear-gradient(145deg, #071522, #0a1b2c 55%, #06111d);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(80, 150, 220, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 150, 220, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .topbar {
      width: 100%;
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 14px 18px;
      background: rgba(3, 11, 20, 0.88);
      border-top: 2px solid var(--blue-main);
      border-bottom: 1px solid rgba(75, 135, 195, 0.13);
      position: relative;
      z-index: 2;
    }

    .top-item {
      color: #aebdce;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .top-item span {
      margin-right: 7px;
      font-size: 15px;
    }

    .hero {
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 55px 20px 70px;
      position: relative;
      z-index: 1;
    }

    .content {
      width: min(100%, 520px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 19px;
      border: 1px solid rgba(92, 166, 230, 0.25);
      border-radius: 999px;
      background: rgba(14, 38, 62, 0.55);
      color: #aebaca;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 23px;
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--blue-light);
      box-shadow: 0 0 12px rgba(47, 142, 229, 0.5);
    }

    .brand {
      font-size: clamp(31px, 8vw, 42px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1.2px;
      margin-bottom: 25px;
    }

    .headline {
      font-size: clamp(35px, 9vw, 52px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -1.8px;
      margin-bottom: 25px;
    }

    .headline .blue {
      color: #78b9ed;
    }

    .emoji {
      display: inline-block;
      font-size: 42px;
      margin-left: 4px;
      transform: translateY(4px);
    }

    .description {
      max-width: 460px;
      margin: 0 auto 18px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.45;
      font-weight: 500;
    }

    .redirect {
      color: #a9b8c9;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 21px;
    }

    .count {
      color: #78b9ed;
    }

    .join-btn {
      width: 100%;
      max-width: 440px;
      min-height: 66px;
      border: 0;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 auto;
      padding: 16px 22px;
      background: linear-gradient(135deg, #1789df, #116bc2);
      color: white;
      font-size: 19px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 14px 35px rgba(13, 104, 188, 0.28);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .join-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 42px rgba(13, 104, 188, 0.4);
      filter: brightness(1.06);
    }

    .whatsapp {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 28px;
    }

    .whatsapp svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .arrow {
      font-size: 29px;
      font-weight: 400;
      margin-left: 2px;
    }

    @media (max-width: 560px) {
      .topbar {
        gap: 12px;
        flex-wrap: wrap;
        min-height: 78px;
      }

      .top-item {
        font-size: 12px;
      }

      .hero {
        min-height: calc(100vh - 78px);
        padding: 45px 16px 55px;
      }

      .brand {
        font-size: 31px;
      }

      .headline {
        font-size: 39px;
      }

      .description {
        font-size: 17px;
      }

      .redirect {
        font-size: 15px;
      }

      .join-btn {
        min-height: 62px;
        border-radius: 19px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="top-item"><span>🔥</span>Promoções exclusivas</div>
    <div class="top-item"><span>🤖</span> IAs e ferramentas</div>
    <div class="top-item"><span>📢</span> Novidades</div>
  </header>

  <main class="hero">
    <section class="content">

      <div class="badge">
        <span class="badge-dot"></span>
        GRUPO OFICIAL
      </div>

      <h1 class="brand">JC STORE</h1>

      <h2 class="headline">
        Entre para o<br>
        <span class="blue">grupo oficial</span>
        <span class="emoji">💙</span>
      </h2>

      <p class="description">
        Assinaturas, IAs, Keys e ofertas em um só lugar.
      </p>

      <p class="redirect">
        Redirecionando para o grupo em <span class="count" id="count">3s</span>...
      </p>

      <a
        class="join-btn"
        href="https://chat.whatsapp.com/EOZnsiwnbYHLd25xR8P4Aj"
        id="joinButton"
      >
        <span class="whatsapp" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.372-.025-.521-.075-.149-.669-1.611-.916-2.206-.242-.579-.487-.5-.669-.51-.173-.008-.372-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982 1-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.002 5.45-4.437 9.884-9.887 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.946L.057 24l6.304-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.478-8.413"/>
          </svg>
        </span>
        ENTRAR NO GRUPO AGORA
        <span class="arrow">→</span>
      </a>

    </section>
  </main>

  <script>
    const groupLink = "https://chat.whatsapp.com/EOZnsiwnbYHLd25xR8P4Aj";
    const countElement = document.getElementById("count");
    const joinButton = document.getElementById("joinButton");

    let seconds = 3;

    const timer = setInterval(() => {
      seconds--;
      countElement.textContent = seconds + "s";

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = groupLink;
      }
    }, 1000);

    joinButton.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.href = groupLink;
    });
  </script>

</body>
</html>
